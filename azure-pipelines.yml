trigger:
  branches:
    include:
      - main
      - release/*

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  dotnetVersion: '10.0.x'
  nodeVersion: '22.x'

steps:
- task: UseDotNet@2
  displayName: 'Install .NET SDK'
  inputs:
    packageType: 'sdk'
    version: $(dotnetVersion)

- task: NodeTool@0
  displayName: 'Install Node.js'
  inputs:
    versionSpec: $(nodeVersion)

- script: |
    dotnet restore backend/TravelSaas.Api/TravelSaas.Api.csproj
  displayName: 'Restore .NET packages'

- script: |
    dotnet build backend/TravelSaas.Api/TravelSaas.Api.csproj --configuration $(buildConfiguration) --no-restore
  displayName: 'Build .NET Web API'

- script: |
    cd TravelSaasClient
    npm ci
    npm run build -- --configuration production
  displayName: 'Install NPM packages & Build Angular 21 SPA'

- script: |
    dotnet publish backend/TravelSaas.Api/TravelSaas.Api.csproj --configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/api
  displayName: 'Publish API Artifact'

- task: CopyFiles@2
  displayName: 'Copy Angular SPA to Staging'
  inputs:
    SourceFolder: 'TravelSaasClient/dist'
    Contents: '**'
    TargetFolder: '$(Build.ArtifactStagingDirectory)/spa'

- task: PublishBuildArtifacts@1
  displayName: 'Publish Build Artifacts'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'travelsaas-drop'
    publishLocation: 'Container'

